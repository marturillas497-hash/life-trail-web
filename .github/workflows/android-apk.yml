name: Android APK

# Manual only, so builds use free minutes when you ask for them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The VERSION file must contain a version like 1.0.0"
            exit 1
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Android only installs an update when this number is higher than the installed one.
          # The time never goes backwards, unlike a run number when an old run is repeated.
          echo "VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install packages
        run: npx --yes pnpm@12.15.0 install --frozen-lockfile

      - name: Build the web app
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
          NEXT_PUBLIC_APP_BUILD: ${{ github.run_number }}
        run: npx --yes pnpm@12.15.0 build

      - name: Copy the web app into the Android project
        run: npx --no-install cap sync android

      - name: Set the version number
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1Life Trail $APP_VERSION\2#" android/app/src/main/res/values/strings.xml
          grep -n "version" android/app/build.gradle
          grep -n "app_name" android/app/src/main/res/values/strings.xml

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the file
        run: |
          APK="life-trail-$APP_VERSION-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "APK_NAME=$APK" >> "$GITHUB_ENV"

      - name: Check the signing key and version of the APK
        continue-on-error: true
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK_NAME" > certs.txt
          "$BT/aapt" dump badging "$APK_NAME" | grep -E "^package:" > badging.txt
          SIGNER="$(grep -m1 "SHA-256 digest" certs.txt | awk '{print $NF}')"
          echo "SIGNER=$SIGNER" >> "$GITHUB_ENV"
          {
            echo "### APK check"
            echo "Every build must show the same signing key, or updates will not install."
            echo '```'
            echo "Signing key SHA-256: $SIGNER"
            cat badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish as a release for easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION-build${{ github.run_number }}" "$APK_NAME" \
            --target "${{ github.sha }}" \
            --title "Life Trail $APP_VERSION (build ${{ github.run_number }})" \
            --notes "Debug build for sideloading. Signing key SHA-256: ${SIGNER:-not checked}" \
            --latest
