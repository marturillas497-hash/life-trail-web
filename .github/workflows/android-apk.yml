name: Android APK

# Manual only, so builds use free minutes when you ask for them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npx --yes pnpm@12.15.0 install --frozen-lockfile

      - name: Build the web app
        run: npx --yes pnpm@12.15.0 build

      - name: Copy the web app into the Android project
        run: npx --no-install cap sync android

      - name: Set the version number
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/' android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk life-trail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-trail-apk
          path: life-trail.apk
          retention-days: 30

      - name: Publish as a release for easy phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" life-trail.apk \
            --target "${{ github.sha }}" \
            --title "Life Trail APK ${{ github.run_number }}" \
            --notes "Debug build for sideloading." \
            --latest
