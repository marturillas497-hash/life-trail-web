name: Android APK

# Manual only, so builds use free minutes when you ask for them.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npx --yes pnpm@12.15.0 install --frozen-lockfile

      - name: Build the web app
        run: npx --yes pnpm@12.15.0 build

      - name: Copy the web app into the Android project
        run: npx --no-install cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk life-trail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: life-trail-apk
          path: life-trail.apk
          retention-days: 30
